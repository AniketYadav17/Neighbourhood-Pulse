[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "neighbourhood-pulse"
dynamic = ["version"]
description = "Spatiotemporal gentrification / valuation-gap model for London"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0,<3",
    "pyarrow>=15",
    "h3>=4.0,<5",
    "requests>=2.31",
    "python-dateutil>=2.8",
    "scikit-learn>=1.3,<2",
    "xgboost>=2.0,<4",
    "joblib>=1.3",
    # Serving + app (Phase C).
    "streamlit>=1.42",
    "pydeck>=0.9",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "anthropic>=0.60",
]

[project.optional-dependencies]
# Acquisition-only heavy geo stack: ingestion (osmnx/geopandas) and
# transformation (geopandas/pyproj). Serving, the app, and Docker don't need it.
geo = [
    "geopandas>=0.14,<2",
    "osmnx>=1.9,<3",
    "pyproj>=3.6",
    "shapely>=2.0",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
    "httpx>=0.27",
    "neighbourhood-pulse[geo]",
]

[project.scripts]
pulse = "neighbourhood_pulse.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]
extend-exclude = ["notebooks", "neighbourpulse"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.dynamic]
version = { attr = "neighbourhood_pulse.__version__" }
